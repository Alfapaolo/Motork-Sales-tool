<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#f5f5f0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#toolbar{background:#fff;border-bottom:1px solid #e0e0d8;display:flex;flex-direction:column;gap:0;z-index:1000;flex-shrink:0}
#toolbar-row1,#toolbar-row2{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;padding:5px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#toolbar-row1::-webkit-scrollbar,#toolbar-row2::-webkit-scrollbar{display:none}
#toolbar-row2{border-top:1px solid #f0f0ea;padding-top:4px;padding-bottom:4px}

/* BOTTOM BAR - mobile first */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #1a5cb8;z-index:2000;flex-shrink:0;display:flex;flex-direction:column}
#omw-row1,#omw-row2{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;padding:5px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#omw-row1::-webkit-scrollbar,#omw-row2::-webkit-scrollbar{display:none}
#omw-row2{border-top:1px solid #e8eaf0}
#map{flex:1;min-height:0;margin-bottom:76px}
@media(min-width:768px){
  #toolbar{flex-direction:row;padding:5px 8px;overflow-x:auto;flex-wrap:nowrap;align-items:center}
  #toolbar-row1,#toolbar-row2{padding:0;border:none;overflow:visible;flex-shrink:0}
  #toolbar-row2{border-top:none}
  #toolbar-row1::after{content:"";display:block;width:1px;height:18px;background:#e0e0d8;margin:0 4px;flex-shrink:0}
  #toolbar-row2::before{content:"";display:block;width:1px;height:18px;background:#e0e0d8;margin:0 4px;flex-shrink:0}
  #bottom-bar{flex-direction:row;padding:5px 10px;align-items:center;gap:6px;overflow-x:auto}
  #omw-row1,#omw-row2{padding:0;border:none;overflow:visible;gap:6px;flex-shrink:0}
  #omw-row2{border-top:none}
  #omw-row1::after{content:"";display:block;width:1px;height:18px;background:#c8cce0;margin:0 2px;flex-shrink:0}
  #map{margin-bottom:44px}
}

#omw-partenza,#omw-arrivo,#omw-via{border:1px solid #ccc;border-radius:6px;padding:5px 8px;font-size:13px;width:120px;outline:none}
#omw-via{border-color:#f57c00;width:110px}
#omw-via:focus{border-color:#f57c00;box-shadow:0 0 0 2px rgba(245,124,0,.2)}
#omw-partenza:focus,#omw-arrivo:focus{border-color:#1a5cb8}
.omw-via-label{font-size:10px;color:#f57c00;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
#map.ai-open{margin-left:300px}

#omw-partenza:focus,#omw-arrivo:focus{border-color:#1a5cb8}
#omw-km{border:1px solid #ccc;border-radius:6px;padding:5px 8px;font-size:13px;background:#fff;outline:none;cursor:pointer}
#omw-go{background:#1a5cb8;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
#omw-go:active{transform:scale(.96)}
#omw-clear{background:#e53935;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;display:none}
#omw-export{background:#388e3c;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.omw-label{font-size:10px;color:#1a5cb8;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
#omw-result-panel{position:fixed;right:0;top:0;bottom:70px;width:280px;background:#fff;border-left:2px solid #1a5cb8;z-index:1500;display:none;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
#omw-panel-header{background:#1a5cb8;color:#fff;padding:10px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#omw-panel-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
#omw-panel-list{overflow-y:auto;flex:1;padding:8px}
.omw-item{border:1px solid #e0e0d8;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.omw-item:hover{background:#f0f4ff}
.omw-item-name{font-weight:700;font-size:13px;color:#111;margin-bottom:3px}
.omw-item-meta{font-size:11px;color:#666}
.omw-item-dist{font-size:11px;color:#1a5cb8;font-weight:600;margin-top:3px}
input[type=text]{border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:13px;width:150px;outline:none}
.btn{border:none;border-radius:6px;padding:3px 7px;font-size:10px;cursor:pointer;white-space:nowrap;font-weight:500;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.96)}
.btn-blue{background:#1a5cb8;color:#fff}
.btn-red{background:#e53935;color:#fff}
.tb-label{font-size:9px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.divider{width:1px;height:22px;background:#e0e0d8;flex-shrink:0}
.pill{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent;display:inline-block;transition:opacity .15s;user-select:none}
.pill:active{transform:scale(.95)}
.pill.off{opacity:.3}
#status{font-size:11px;color:#888;white-space:nowrap}
.popup-title{font-weight:600;font-size:14px;margin-bottom:6px;color:#111}
.popup-row{font-size:12px;color:#444;margin-bottom:3px;display:flex;gap:6px}
.popup-label{color:#888;min-width:72px;flex-shrink:0}
.popup-badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600}
.popup-btn{margin-top:8px;width:100%;text-align:center;background:#1a5cb8!important;color:#ffffff!important;border:none;border-radius:6px;padding:8px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none!important;display:block}
.popup-btn:visited,.popup-btn:link,.popup-btn:hover,.popup-btn:active{color:#ffffff!important;background:#1a5cb8!important}
.popup-btn-web{margin-top:6px;width:100%;text-align:center;background:#388e3c!important;color:#ffffff!important;border:none;border-radius:6px;padding:8px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none!important;display:block}
.popup-btn-web:visited,.popup-btn-web:link,.popup-btn-web:hover,.popup-btn-web:active{color:#ffffff!important;background:#388e3c!important}
.dealer-label{background:rgba(255,255,255,.95)!important;border:1px solid #ccc!important;border-radius:4px!important;padding:2px 6px!important;font-size:11px!important;font-weight:600!important;color:#222!important;box-shadow:0 1px 3px rgba(0,0,0,.2)!important}
.dealer-label::before{display:none!important}
#miss-bar{background:#fff3cd;border-bottom:1px solid #ffc107;padding:5px 10px;font-size:11px;color:#856404;display:none;flex-shrink:0;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;display:none;white-space:nowrap}
</style>

<body>
<div id="toolbar">
  <div id="toolbar-row1">
    <button class="btn btn-blue" onclick="document.getElementById('csv-input').click()">📂 Carica CSV</button>
    <button class="btn btn-red" id="clear-btn" onclick="clearCache()">🗑 Svuota cache</button>
    <input type="file" id="csv-input" accept=".csv,text/csv,text/plain,application/csv,application/vnd.ms-excel" style="display:none">
    <span id="status" style="white-space:nowrap;font-size:12px;color:#666">Carica un CSV</span>
    <input type="text" id="search" placeholder="Cerca dealer…" oninput="filterMarkers()" style="min-width:120px">
  </div>
  <div id="toolbar-row2">
    <span class="tb-label">TIPO</span>
    <button class="btn" style="font-size:9px;padding:2px 4px" onclick="selAllTypes()">✓</button>
    <button class="btn" style="font-size:9px;padding:2px 4px" onclick="selNoneTypes()">✗</button>
    <div id="type-filters" style="display:flex;gap:3px;flex-wrap:nowrap"></div>
    <div class="divider" style="flex-shrink:0"></div>
    <span class="tb-label">RATING</span>
    <button class="btn" style="font-size:9px;padding:2px 4px" onclick="selAllRatings()">✓</button>
    <button class="btn" style="font-size:9px;padding:2px 4px" onclick="selNoneRatings()">✗</button>
    <div id="rating-filters" style="display:flex;gap:3px;flex-wrap:nowrap"></div>
  </div>
</div>
<div id="miss-bar" style="display:none"><span id="miss-text"></span><button onclick="downloadErrors()" style="font-size:10px;padding:2px 7px;border:1px solid #856404;border-radius:4px;background:#fff;color:#856404;cursor:pointer;white-space:nowrap">⬇ Scarica errori</button></div>
<div id="map"></div>
<!-- ON MY WAY BAR -->
<div id="bottom-bar">
  <div id="omw-row1">
    <span class="omw-label">🚗</span>
    <input type="text" id="omw-partenza" placeholder="Partenza…" value="" style="width:90px">
    <input type="text" id="omw-via" placeholder="Via…" title="Passa per questo comune o concessionaria" style="width:70px">
    <input type="text" id="omw-arrivo" placeholder="Arrivo…" value="Gorle" style="width:80px">
    <select id="omw-km">
      <option value="5" selected>± 5 km</option>
      <option value="10">± 10 km</option>
      <option value="15">± 15 km</option>
      <option value="20">± 20 km</option>
      <option value="30">± 30 km</option>
      <option value="50">± 50 km</option>
    </select>
    <button id="omw-go" onclick="runOnMyWay()">🔍 Cerca</button>
    <button id="omw-clear" onclick="clearRoute()">✕</button>
    <button id="omw-export" onclick="exportUnified()">⬇ DOCX</button>
  </div>
  <div id="omw-row2">
  <button class="btn" style="background:#f5f5f0;padding:5px 8px;font-size:16px;line-height:1" onclick="locateMe()" title="Centra sulla mia posizione">📍</button>
  <select id="nearme-km" onchange="searchNearMe()" style="border:1px solid #ccc;border-radius:6px;padding:5px 6px;font-size:12px;background:#fff;cursor:pointer">
    <option value="">Vicino a me…</option>
    <option value="5">± 5 km</option>
    <option value="10">± 10 km</option>
    <option value="15">± 15 km</option>
    <option value="20">± 20 km</option>
    <option value="30">± 30 km</option>
    <option value="50">± 50 km</option>
  </select>
  <button class="btn" style="background:#e53935;color:#fff;padding:5px 8px;font-size:12px;font-weight:700" onclick="clearAll()" title="Pulisci tutti i campi di ricerca">✕ Pulisci</button>
  <button class="btn" style="background:#f5f5f0;padding:5px 8px;font-size:13px;font-weight:700" onclick="zoomToVisible()" title="Zoom sui dealer visibili">⛶ Zoom</button>
    <span style="margin-left:auto;font-size:13px;font-weight:700;color:#1a5cb8;white-space:nowrap" id="visible-count-bar">0</span>
  </div>
</div>

<!-- RESULT PANEL -->
<div id="omw-result-panel">
  <div id="omw-panel-header">
    <span id="omw-panel-title">Dealer lungo il percorso</span>
    <button id="omw-panel-close" onclick="document.getElementById('omw-result-panel').style.display='none'">✕</button>
  </div>
  <div id="omw-panel-list"></div>
</div>

<div id="toast"></div>

<script>
function toast(msg,duration){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.display='none';},duration||2500);}

var DB='dealermap',ST='csv';
function dbOpen(){return new Promise(function(res,rej){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(e){e.target.result.createObjectStore(ST);};r.onsuccess=function(e){res(e.target.result);};r.onerror=function(e){rej(e);};});}
function dbSave(text){dbOpen().then(function(db){db.transaction(ST,'readwrite').objectStore(ST).put(text,'last');}).catch(function(){});}
function dbLoad(){return dbOpen().then(function(db){return new Promise(function(res){var r=db.transaction(ST,'readonly').objectStore(ST).get('last');r.onsuccess=function(e){res(e.target.result||null);};r.onerror=function(){res(null);};});}).catch(function(){return null;});}
function dbClear(){return new Promise(function(res,rej){var r=indexedDB.deleteDatabase(DB);r.onsuccess=res;r.onerror=rej;r.onblocked=res;});}

function normalizeCity(c){
  return (c||'').toLowerCase().trim()
    .replace(/ã¹/g,'u').replace(/ã²/g,'o').replace(/ã /g,'a')
    .replace(/ã¨/g,'e').replace(/ã¬/g,'i').replace(/ã©/g,'e')
    .replace(/[àáâã]/g,'a').replace(/[èéêë]/g,'e')
    .replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o')
    .replace(/[ùúûü]/g,'u').replace(/[''`]/g,' ')
    .replace(/-/g,' ').replace(/\s+/g,' ').trim();
}

function getCityCoords(city){
  if(!city) return null;
  var k=normalizeCity(city);
  if(CITIES[k]) return {lat:CITIES[k][0],lng:CITIES[k][1]};
  var keys=Object.keys(CITIES),w=k.split(' ')[0];
  for(var i=0;i<keys.length;i++)
    if(keys[i].indexOf(w)===0&&Math.abs(keys[i].length-k.length)<5)
      return {lat:CITIES[keys[i]][0],lng:CITIES[keys[i]][1]};
  return null;
}

async function geocodeCitiesBatch(list){
  var prompt='Sei un geocoder. Lista di città italiane. Rispondi SOLO con JSON valido, niente markdown. Formato: {"nome": [lat,lng]}. Città:\n'+list.join('\n');
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:prompt}]})});
    var d=await r.json();
    var t=(d.content&&d.content[0]&&d.content[0].text)||'';
    t=t.replace(/```json|```/g,'').trim();
    var obj=JSON.parse(t);
    Object.keys(obj).forEach(function(c){var v=obj[c];if(Array.isArray(v)&&v.length===2){var k=normalizeCity(c);CITIES[k]=[parseFloat(v[0]),parseFloat(v[1])];}});
  }catch(e){}
}

function getPhysicalAddress(d){
  var physStreet=(d['Addresses__r.records.0.Street__c']||'').trim();
  var physCity=(d['Addresses__r.records.0.City__c']||'').trim();
  var physProv=(d['Addresses__r.records.0.State_Province__c']||'').trim();
  var billStreet=(d.BillingStreet||'').trim();
  var billCity=(d.BillingCity||'').trim();
  var billProv=(d.BillingState||'').trim();
  // Se la sede fisica è valorizzata ed è diversa dalla legale, usa quella fisica
  var hasDiff = physStreet && physCity && (physStreet.toLowerCase()!==billStreet.toLowerCase()||physCity.toLowerCase()!==billCity.toLowerCase());
  return {
    street: hasDiff ? physStreet : billStreet,
    city:   hasDiff ? physCity   : billCity,
    prov:   hasDiff ? physProv   : billProv,
    isDiff: hasDiff
  };
}

function buildFilters(dealers){
  var types=[...new Set(dealers.map(function(d){return d.Customer_Type__c;}).filter(Boolean))].sort();
  var ratings=[...new Set(dealers.map(function(d){return d.Rating;}).filter(Boolean))].sort();
  activeTypes=new Set(types);activeRatings=new Set(ratings);
  var tf=document.getElementById('type-filters');tf.innerHTML='';
  types.forEach(function(t){
    var p=document.createElement('span');p.className='pill';p.textContent=t;
    p.style.cssText='background:'+tc(t)+'22;border-color:'+tc(t)+';color:'+tc(t);
    p.onclick=function(){if(activeTypes.has(t)){activeTypes.delete(t);p.classList.add('off');}else{activeTypes.add(t);p.classList.remove('off');}filterMarkers();};
    tf.appendChild(p);
  });
  var rf=document.getElementById('rating-filters');rf.innerHTML='';
  ratings.forEach(function(r){
    var info=ri(r);var p=document.createElement('span');p.className='pill';p.textContent=r;
    p.style.cssText='background:'+info.c+'22;border-color:'+info.c+';color:'+info.c;
    p.onclick=function(){if(activeRatings.has(r)){activeRatings.delete(r);p.classList.add('off');}else{activeRatings.add(r);p.classList.remove('off');}filterMarkers();};
    rf.appendChild(p);
  });
}

function filterMarkers(){
  var q=document.getElementById('search').value.toLowerCase().trim();
  markerLayer.clearLayers();
  var visible=0;
  // Se c'è una rotta attiva, ricalcola i dealer nel range rispettando i filtri correnti
  if(routeLayer && omwDealers.length > 0){
    refreshOmwWithFilters(q);
    return;
  }
  markers.forEach(function(o){
    var d=o.dealer;
    if((q ? d.Name.toLowerCase().includes(q) : (activeTypes.size>0&&activeRatings.size>0&&activeTypes.has(d.Customer_Type__c)&&activeRatings.has(d.Rating)))){
      markerLayer.addLayer(o.marker);
      visible++;
    }
  });
  updateVisibleCount(visible);
  // Se il pannello mappa è aperto, aggiorna la lista laterale
  if(mapPanelOpen) refreshMapPanel();
  autoZoomToVisible();
}

function refreshOmwWithFilters(q){
  if(!routeLayer) return;
  var kmRange=parseInt(document.getElementById('omw-km').value);
  // Rileggo i punti della polyline
  var routePoints=[];
  routeLayer.getLatLngs().forEach(function(ll){
    if(Array.isArray(ll)) ll.forEach(function(p){routePoints.push({lat:p.lat,lng:p.lng});});
    else routePoints.push({lat:ll.lat,lng:ll.lng});
  });
  if(!q) q='';
  // Ricalcola omwDealers con filtri correnti
  omwDealers=[];
  markers.forEach(function(o){
    var d=o.dealer;
    if((!d.Customer_Type__c||activeTypes.has(d.Customer_Type__c))&&
       (!d.Rating||activeRatings.has(d.Rating))&&
       (!q||d.Name.toLowerCase().includes(q))){
      var latlng=o.marker.getLatLng();
      var dist=distFromRoute(latlng.lat,latlng.lng,routePoints);
      if(dist<=kmRange) omwDealers.push({o:o,dist:dist});
    }
  });
  // Ri-evidenzia
  var normalSet=new Set(omwDealers.map(function(x){return x.o;}));
  markers.forEach(function(o){
    var d=o.dealer;
    if((!d.Customer_Type__c||activeTypes.has(d.Customer_Type__c))&&
       (!d.Rating||activeRatings.has(d.Rating))&&
       (!q||d.Name.toLowerCase().includes(q))){
      var col=tc(d.Customer_Type__c),r=ri(d.Rating),s=r.s;
      var isMatch=normalSet.has(o);
      if(isMatch) s=s+4;
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(s*2)+'" height="'+(s*2)+'" viewBox="0 0 '+(s*2)+' '+(s*2)+'">'
        +'<circle cx="'+s+'" cy="'+s+'" r="'+(s-2)+'" fill="'+col+'" stroke="'+(isMatch?'#ffe600':'white')+'" stroke-width="'+(isMatch?3:2)+'" opacity="'+(isMatch?1:.25)+'"/>'

        +'</svg>';
      var icon=L.divIcon({html:svg,className:'',iconSize:[s*2,s*2],iconAnchor:[s,s],popupAnchor:[0,-s]});
      o.marker.setIcon(icon);
      markerLayer.addLayer(o.marker);
    }

  // Aggiorna pannello

        +'<div class="omw-item-meta">📍 '+(d.BillingCity||'—')+' · '+(d.Rating||'—')+'</div>'
        +'<div class="omw-item-meta" style="color:#555">'+(d.Active_Products_List__c||'—')+'</div>'
        +'<div class="omw-item-dist">~'+item.dist.toFixed(1)+' km dalla strada</div>';
      el.onclick=(function(o){return function(){map.setView(o.marker.getLatLng(),13);o.marker.openPopup();};})(item.o);

function updateSmartLabels(){
  var visibleMarkers=[];
  markerLayer.eachLayer(function(m){ if(m.getLatLng) visibleMarkers.push(m); });

  // Sopra 30 dealer: nascondi tutte le label permanenti (troppo affollato)
  if(visibleMarkers.length===0 || visibleMarkers.length>30){
    markers.forEach(function(o){
      if(o.marker.isTooltipOpen && o.marker.isTooltipOpen()) o.marker.closeTooltip();
    });
    return;
  }

  // Sotto 30: mostra le label, scegliendo direzione per minimizzare sovrapposizioni
  // Converte lat/lng in pixel schermo per stimare collisioni
  var points=visibleMarkers.map(function(m){
    var p=map.latLngToLayerPoint(m.getLatLng());
    return {marker:m, x:p.x, y:p.y};
  });

  // Per ogni marker calcola la direzione migliore guardando i vicini
  points.forEach(function(pt){
    var neighborsRight=0, neighborsLeft=0, neighborsAbove=0, neighborsBelow=0;
    points.forEach(function(other){
      if(other===pt) return;
      var dx=other.x-pt.x, dy=other.y-pt.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>120) return; // troppo lontano per influire
      if(dx>0) neighborsRight++;
      if(dx<0) neighborsLeft++;
      if(dy<0) neighborsAbove++;
      if(dy>0) neighborsBelow++;
    });

    // Scegli la direzione con meno vicini (meno probabilità di sovrapposizione)
    var dir='right', offset=[10,0];
    var min=neighborsRight;
    if(neighborsLeft<min){min=neighborsLeft;dir='left';offset=[-10,0];}
    if(neighborsAbove<min){min=neighborsAbove;dir='top';offset=[0,-8];}
    if(neighborsBelow<min){min=neighborsBelow;dir='bottom';offset=[0,8];}

    pt.marker.unbindTooltip();
    pt.marker.bindTooltip(pt.marker._dealerName||'',{permanent:true,direction:dir,className:'dealer-label',offset:offset});
    pt.marker.openTooltip();
  });
}

}

async function processCSVText(csvText){
  markers=[];activeTypes=new Set();activeRatings=new Set();
  if(markerLayer) markerLayer.clearLayers();
  document.getElementById('type-filters').innerHTML='';
  document.getElementById('rating-filters').innerHTML='';
  document.getElementById('miss-bar').style.display='none';
  document.getElementById('status').textContent='Elaborazione…';
  Papa.parse(csvText,{header:true,skipEmptyLines:true,complete:async function(res){
    var dealers=res.data.filter(function(d){return d.Name&&d.BillingCity&&(d.Status__c||'Open')==='Open';});
    buildFilters(dealers);
    var toGeocode=[];
    dealers.forEach(function(d){
      var physCity=(d['Addresses__r.records.0.City__c']||'').trim();
      var billCity=(d.BillingCity||'').trim();
      // Prova: 1) città fisica 2) città legale 3) aggiungi a geocode queue
      var c=null;
      if(physCity) c=getCityCoords(physCity);
      if(!c && billCity) c=getCityCoords(billCity);
      if(c) placeMarker(d,c); else toGeocode.push(d);
    });
    document.getElementById('status').textContent=markers.length+' dealer';
    updateVisibleCount(markers.length);
    if(markers.length>0){var g=L.featureGroup(markers.map(function(o){return o.marker;}));map.fitBounds(g.getBounds().pad(.1));}
    var stillMissed=[];
    if(toGeocode.length>0){
      // Geocodifica sia città fisica che legale per coprire tutti i casi
      var physCities=toGeocode.map(function(d){return (d['Addresses__r.records.0.City__c']||'').trim();}).filter(Boolean);
      var billCities=toGeocode.map(function(d){return d.BillingCity||'';}).filter(Boolean);
      var uniq=[...new Set([...physCities,...billCities])];
      for(var i=0;i<uniq.length;i+=80){await geocodeCitiesBatch(uniq.slice(i,i+80));await sleep(200);}
      toGeocode.forEach(function(d){
        var physCity=(d['Addresses__r.records.0.City__c']||'').trim();
        var c=null;
        if(physCity) c=getCityCoords(physCity);
        if(!c) c=getCityCoords(d.BillingCity);
        if(!c) {
          // Fallback: usa il capoluogo della provincia
          var PROV_CAPS = {
            'AG':'Agrigento','AL':'Alessandria','AN':'Ancona','AO':'Aosta','AR':'Arezzo',
            'AP':'Ascoli Piceno','AT':'Asti','AV':'Avellino','BA':'Bari','BT':'Barletta',

            'BZ':'Bolzano','BS':'Brescia','BR':'Brindisi','CA':'Cagliari','CL':'Caltanissetta',
            'CB':'Campobasso','CE':'Caserta','CT':'Catania','CZ':'Catanzaro','CH':'Chieti',
            'CO':'Como','CS':'Cosenza','CR':'Cremona','KR':'Crotone','CN':'Cuneo',
            'EN':'Enna','FM':'Fermo','FE':'Ferrara','FI':'Firenze','FG':'Foggia',
            'FC':'Forlì','FR':'Frosinone','GE':'Genova','GO':'Gorizia','GR':'Grosseto',
            'IM':'Imperia','IS':'Isernia','SP':'La Spezia','AQ':'L Aquila','LT':'Latina',
            'LE':'Lecce','LC':'Lecco','LI':'Livorno','LO':'Lodi','LU':'Lucca',
            'MC':'Macerata','MN':'Mantova','MS':'Massa','MT':'Matera','ME':'Messina',
            'MI':'Milano','MO':'Modena','MB':'Monza','NA':'Napoli','NO':'Novara',
            'NU':'Nuoro','OR':'Oristano','PD':'Padova','PA':'Palermo','PR':'Parma',
            'PV':'Pavia','PG':'Perugia','PU':'Pesaro','PE':'Pescara','PC':'Piacenza',
            'PI':'Pisa','PT':'Pistoia','PN':'Pordenone','PZ':'Potenza','PO':'Prato',
            'RG':'Ragusa','RA':'Ravenna','RC':'Reggio Calabria','RE':'Reggio Emilia',
            'RI':'Rieti','RN':'Rimini','RM':'Roma','RO':'Rovigo','SA':'Salerno',
            'SS':'Sassari','SV':'Savona','SI':'Siena','SR':'Siracusa','SO':'Sondrio',
            'SU':'Sud Sardegna','TA':'Taranto','TE':'Teramo','TR':'Terni','TO':'Torino',
            'TP':'Trapani','TN':'Trento','TV':'Treviso','TS':'Trieste','UD':'Udine',
            'VA':'Varese','VE':'Venezia','VB':'Verbania','VC':'Vercelli','VR':'Verona',
            'VV':'Vibo Valentia','VI':'Vicenza','VT':'Viterbo'
          };
          // Prova la città legale come testo grezzo (senza l'indirizzo specifico)
          var billCity = (d.BillingCity||'').trim();
          if(billCity) c = getCityCoords(billCity);
          if(!c) {
            // Ultimo fallback: capoluogo di provincia
            var prov = (d.BillingState||'').toUpperCase().trim();
            var capName = PROV_CAPS[prov];
            if(capName) c = getCityCoords(capName);
          }
          if(c) {
            placeMarker(d, c);
            stillMissed.push(d.Name+' → posizionato a '+billCity+' (indirizzo esatto non trovato)');
          } else {
            stillMissed.push(d.Name+' ('+billCity+')');
          }
        } else {
          // già trovato sopra
        }
      });
      filterMarkers();
      document.getElementById('status').textContent=markers.length+' dealer';
      updateVisibleCount(markers.length);
      if(markers.length>0){var g2=L.featureGroup(markers.map(function(o){return o.marker;}));map.fitBounds(g2.getBounds().pad(.1));}
    }
    var mb=document.getElementById('miss-bar');
    if(stillMissed.length>0){var uniqM=[...new Set(stillMissed)];mb.style.display='block';mb.textContent='⚠ '+stillMissed.length+' dealer non posizionati: '+uniqM.join(', ');}
    else mb.style.display='none';
  }});
}

// ===== ON MY WAY =====
var routeLayer = null;
var mapPanelOpen = false;
var omwMarkers = [];
var omwDealers = [];

function latLng(city) {
  var c = getCityCoords(city);
  if (c) return {lat: c.lat, lng: c.lng};
  return null;
}

// Distanza punto-segmento in km (haversine approssimata)
function haversine(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function pointToSegmentDist(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  if (dx === 0 && dy === 0) return haversine(px, py, ax, ay);
  var t = ((px - ax)*dx + (py - ay)*dy) / (dx*dx + dy*dy);
  t = Math.max(0, Math.min(1, t));
  var nx = ax + t*dx, ny = ay + t*dy;
  return haversine(px, py, nx, ny);
}

// Calcola distanza minima da un punto a tutti i segmenti della polyline
function distFromRoute(lat, lng, routePoints) {
  var minDist = Infinity;
  for (var i = 0; i < routePoints.length - 1; i++) {
    var d = pointToSegmentDist(lat, lng,
      routePoints[i].lat, routePoints[i].lng,
      routePoints[i+1].lat, routePoints[i+1].lng);
    if (d < minDist) minDist = d;
  }
  return minDist;
}

function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (window._radarCircle) { map.removeLayer(window._radarCircle); window._radarCircle = null; }
  omwMarkers.forEach(function(m) { map.removeLayer(m); });
  omwMarkers = [];
  omwDealers = [];
  document.getElementById('omw-result-panel').style.display = 'none';
  document.getElementById('omw-clear').style.display = 'none';
  document.getElementById('nearme-km').value = '';
  document.getElementById('omw-panel-list').innerHTML = '';
  filterMarkers();
}

async function runOnMyWay() {
  var partenzaRaw = document.getElementById('omw-partenza').value.trim();
  var arrivoRaw = document.getElementById('omw-arrivo').value.trim();
  var kmRange = parseInt(document.getElementById('omw-km').value);

  if (!arrivoRaw) { toast('⚠ Inserisci almeno il comune di arrivo/destinazione'); return; }

  // Solo arrivo compilato → radar attorno al comune di arrivo
  if (!partenzaRaw) {
    runRadar(arrivoRaw, kmRange);
    return;
  }

  var partenzaNorm = normalizeCity(partenzaRaw);
  var arrivoNorm = normalizeCity(arrivoRaw);

  var pCoords = latLng(partenzaRaw);
  var aCoords = latLng(arrivoRaw);

  // se non trovato, prova geocode AI
  if (!pCoords || !aCoords) {
    toast('🔄 Geolocalizzazione comuni…');
    var toGeo = [];
    if (!pCoords) toGeo.push(partenzaRaw);
    if (!aCoords) toGeo.push(arrivoRaw);
    await geocodeCitiesBatch(toGeo);
    if (!pCoords) pCoords = latLng(partenzaRaw);
    if (!aCoords) aCoords = latLng(arrivoRaw);
  }

  if (!pCoords) { toast('⚠ Comune di partenza non trovato: ' + partenzaRaw); return; }
  if (!aCoords) { toast('⚠ Comune di arrivo non trovato: ' + arrivoRaw); return; }

  clearRoute();
  toast('🔄 Calcolo percorso…');

  // Usa OSRM (routing gratuito, no API key)
  var viaRaw = document.getElementById('omw-via').value.trim();
  var vCoords = null;
  if (viaRaw) {
    // prova prima come comune
    vCoords = latLng(viaRaw);
    if (!vCoords) {
      // prova come nome concessionaria nei dati caricati
      var viaLow = viaRaw.toLowerCase();
      markers.forEach(function(o) {
        if (!vCoords && o.dealer.Name.toLowerCase().includes(viaLow)) {
          var ll = o.marker.getLatLng();
          vCoords = {lat: ll.lat, lng: ll.lng};
        }
      });
    }
    if (!vCoords) {
      // geocode via AI
      await geocodeCitiesBatch([viaRaw]);
      vCoords = latLng(viaRaw);
    }
    if (!vCoords) { toast('⚠ Waypoint "' + viaRaw + '" non trovato — uso percorso diretto'); }
  }

  var waypointStr = vCoords ? (';' + vCoords.lng + ',' + vCoords.lat) : '';
  var url = 'https://router.project-osrm.org/route/v1/driving/'
    + pCoords.lng + ',' + pCoords.lat
    + waypointStr + ';'
    + aCoords.lng + ',' + aCoords.lat
    + '?overview=full&geometries=geojson';

  var routePoints = [];
  try {
    var resp = await fetch(url);
    var data = await resp.json();
    if (data.routes && data.routes.length > 0) {
      var coords = data.routes[0].geometry.coordinates;
      routePoints = coords.map(function(c) { return {lat: c[1], lng: c[0]}; });
      var latlngs = routePoints.map(function(p) { return [p.lat, p.lng]; });
      routeLayer = L.polyline(latlngs, {color: '#e53935', weight: 5, opacity: 0.8}).addTo(map);
      map.fitBounds(routeLayer.getBounds().pad(0.1));
    } else {
      throw new Error('no route');
    }
  } catch(e) {
    // fallback: linea retta
    routePoints = [pCoords, aCoords];
    routeLayer = L.polyline([[pCoords.lat, pCoords.lng],[aCoords.lat, aCoords.lng]],
      {color:'#e53935',weight:5,opacity:.8,dashArray:'10,8'}).addTo(map);
    map.fitBounds(routeLayer.getBounds().pad(0.1));
    toast('⚠ OSRM non raggiunto — uso linea retta', 3000);
  }

  // Filtro marker attivi (rispetta filtri tipo+rating+search)
  var visibleDealers = [];
  var q = document.getElementById('search').value.toLowerCase().trim();
  markers.forEach(function(o) {
    var d = o.dealer;
    if ((!d.Customer_Type__c || activeTypes.has(d.Customer_Type__c))
      && (!d.Rating || activeRatings.has(d.Rating))
      && (!q || d.Name.toLowerCase().includes(q))) {
      visibleDealers.push(o);
    }
  });

  // Calcola distanza dal percorso per ogni dealer
  omwDealers = [];
  visibleDealers.forEach(function(o) {
    var latlng = o.marker.getLatLng();
    var dist = distFromRoute(latlng.lat, latlng.lng, routePoints);
    if (dist <= kmRange) {
      omwDealers.push({o: o, dist: dist});
    }
  });

  // Ordina per distanza dalla partenza (proiezione sul percorso)
  omwDealers.sort(function(a, b) {
    var dA = haversine(pCoords.lat, pCoords.lng, a.o.marker.getLatLng().lat, a.o.marker.getLatLng().lng);
    var dB = haversine(pCoords.lat, pCoords.lng, b.o.marker.getLatLng().lat, b.o.marker.getLatLng().lng);
    return dA - dB;
  });

  // Evidenzia i marker trovati
  markerLayer.clearLayers();
  var normalSet = new Set(omwDealers.map(function(x){return x.o;}));
  markers.forEach(function(o) {
    if (normalSet.has(o)) {
      // marker evidenziato (bordo giallo, più grande)
      var d = o.dealer;
      var col = tc(d.Customer_Type__c), r = ri(d.Rating), s = r.s + 4;
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(s*2)+'" height="'+(s*2)+'" viewBox="0 0 '+(s*2)+' '+(s*2)+'">'
        +'<circle cx="'+s+'" cy="'+s+'" r="'+(s-2)+'" fill="'+col+'" stroke="#ffe600" stroke-width="3"/>'
        +'<circle cx="'+s+'" cy="'+s+'" r="'+Math.floor(s/3)+'" fill="white" opacity=".9"/>'
        +'</svg>';
      var icon = L.divIcon({html:svg,className:'',iconSize:[s*2,s*2],iconAnchor:[s,s],popupAnchor:[0,-s]});
      o.marker.setIcon(icon);
      markerLayer.addLayer(o.marker);
    } else {
      // marker dimmed
      var d2 = o.dealer;
      var col2 = tc(d2.Customer_Type__c), r2 = ri(d2.Rating), s2 = r2.s;
      var svg2 = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(s2*2)+'" height="'+(s2*2)+'" viewBox="0 0 '+(s2*2)+' '+(s2*2)+'">'
        +'<circle cx="'+s2+'" cy="'+s2+'" r="'+(s2-2)+'" fill="'+col2+'" stroke="white" stroke-width="2" opacity=".25"/>'
        +'<circle cx="'+s2+'" cy="'+s2+'" r="'+Math.floor(s2/3)+'" fill="white" opacity=".15"/>'
        +'</svg>';
      var icon2 = L.divIcon({html:svg2,className:'',iconSize:[s2*2,s2*2],iconAnchor:[s2,s2],popupAnchor:[0,-s2]});
      o.marker.setIcon(icon2);
      markerLayer.addLayer(o.marker);
    }
  });

  // Pannello laterale
  var panel = document.getElementById('omw-result-panel');
  var list = document.getElementById('omw-panel-list');
  document.getElementById('omw-panel-title').textContent =
    omwDealers.length + ' dealer entro ' + kmRange + ' km dal percorso';
  list.innerHTML = '';

  if (omwDealers.length === 0) {
    list.innerHTML = '<div style="padding:16px;color:#888;font-size:13px;text-align:center">Nessun dealer trovato<br>nel range selezionato</div>';
  } else {
    omwDealers.forEach(function(item, idx) {
      var d = item.o.dealer;
      var col = tc(d.Customer_Type__c);
      var el = document.createElement('div');
      el.className = 'omw-item';
      el.innerHTML = '<div class="omw-item-name">' + (idx+1) + '. ' + d.Name + '</div>'
        + '<div class="omw-item-meta" style="color:'+col+';font-weight:600">'+(d.Customer_Type__c||'—')+'</div>'
        + '<div class="omw-item-meta">📍 ' + (d.BillingCity||'—') + ' · ' + (d.Rating||'—') + '</div>'
        + '<div class="omw-item-meta" style="color:#555">' + (d.Active_Products_List__c||'—') + '</div>'
        + '<div class="omw-item-dist">~' + item.dist.toFixed(1) + ' km dalla strada</div>';
      el.onclick = (function(o){ return function(){ map.setView(o.marker.getLatLng(), 13); o.marker.openPopup(); }; })(item.o);
      list.appendChild(el);
    });
  }

  panel.style.display = 'flex';
  document.getElementById('omw-clear').style.display = 'inline-block';
  if (omwDealers.length > 0) 
  toast('✅ ' + omwDealers.length + ' dealer trovati lungo il percorso');
}

function exportDOCX(customList, customTitle, customFilename) {
  if (!window.docx) { toast('⚠ Libreria DOCX non caricata, riprova'); return; }

  var dealerList = customList || omwDealers;
  if (!dealerList || dealerList.length === 0) { toast('⚠ Nessun dealer da esportare'); return; }

  var partenza = customTitle || (document.getElementById('omw-partenza').value.trim() + ' → ' + document.getElementById('omw-arrivo').value.trim());
  var km       = document.getElementById('omw-km').value;
  var today    = new Date().toLocaleDateString('it-IT');
  var filename = customFilename || ('percorso_' + document.getElementById('omw-partenza').value.trim().replace(/\s+/g,'_') + '.docx');

  var EXCLUDE = ['iubenda','accessibility','add-on','facebook feed','xml feed',
    'livespark','sellspark','carspark','keyloop','cloudflare','ai creative studio',
    'trainspark','training','onboarding','gestionale'];

  var UPSELL = [
    {needs:'webspark',  miss:'leadspark',   label:'LeadSparK',          brief:' — Cattura ogni lead dal sito in un unico CRM.'},
    {needs:'webspark',  miss:'seospark',    label:'SeoSparK',           brief:' — Più traffico organico, meno dipendenza dai portali.'},
    {needs:'leadspark', miss:'callspark',   label:'CallSparK',          brief:' — Nessuna telefonata/lead persa, analisi AI di ogni chiamata.'},
    {needs:'leadspark', miss:'whatsapp',    label:'WhatsApp Business',  brief:' — Gestisci lead via WhatsApp dal CRM.'},
    {needs:'leadspark', miss:'agentspark',  label:'AgentSparK',         brief:' — AI H24 che risponde ai lead anche fuori orario.'},
    {needs:'leadspark', miss:'predictspark',label:'PredictSparK',       brief:' — Intercetta clienti in scadenza per upsell aftersales.'},
    {needs:'leadspark', miss:'fidspark',    label:'FidSparK',           brief:' — Gestione recensioni e reputazione integrata nel CRM.'},
    {needs:'stockspark',miss:'bgremoval',   label:'Rimozione Sfondo',   brief:' — Foto auto professionali in automatico.'},
    {needs:'stockspark',miss:'aivideo',     label:'AI Video',           brief:' — Video auto generati da AI in secondi.'},
    {needs:'stockspark',miss:'stockapp',    label:'StockSparK App',     brief:' — Fotografa e pubblica le auto dal piazzale in 2 minuti.'},
    {needs:'stockspark',miss:'adspark',     label:'AdSparK',            brief:' — Campagne Meta/Google sincronizzate con lo stock reale.'},
    {needs:'webspark_no_stock',miss:'stockspark',label:'StockSparK',    brief:' — Pubblica lo stock su tutti i portali automaticamente.'},
    {needs:'adspark',   miss:'predictspark',label:'PredictSparK',       brief:' — Campagne predittive sull\'aftersales sui clienti giusti.'},
    {needs:'cdp',       miss:'callspark',   label:'CallSparK',          brief:' — Profilo cliente completo prima di rispondere al telefono.'},
    {needs:'cdp',       miss:'agentspark',  label:'AgentSparK',         brief:' — Agente AI personalizzato sui dati CDP H24.'},
  ];

  var MACRO = {
    webspark:   ['webspark','ws revolution','ws - advanced','ws - premium','ws - core'],
    webspark_no_stock: ['webspark service','webspark rent','ws - service','ws - rent','webspark revolution - service','webspark revolution - rent','webspark revolution - mobility'],
    leadspark:  ['leadspark','ls - premium','ls - professional','ls - lead manager'],
    stockspark: ['stockspark'],
    callspark:  ['callspark'],
    agentspark: ['agentspark'],
    fidspark:   ['fidspark'],
    predictspark:['predictspark'],
    seospark:   ['seospark'],
    adspark:    ['adspark','campaign budget'],
    cdp:        ['cdp','full platform'],
    whatsapp:   ['whatsapp'],
    bgremoval:  ['background removal'],
    aivideo:    ['ai video','ai videos'],
    stockapp:   ['stockspark app'],
  };

  function hasMacro(prods, key) {
    var p = prods.toLowerCase();
    return MACRO[key] && MACRO[key].some(function(kw){ return p.indexOf(kw) >= 0; });
  }

  function getActive(prods) {
    if (!prods || prods === '—') return [];
    return prods.split(';').map(function(s){ return s.trim(); }).filter(function(s){
      var sl = s.toLowerCase();
      return !EXCLUDE.some(function(ex){ return sl.indexOf(ex) >= 0; }) && s.length > 2;
    });
  }

  function getOpps(prods) {
    var seen = {}, result = [];
    UPSELL.forEach(function(r){
      if (hasMacro(prods, r.needs) && !hasMacro(prods, r.miss) && !seen[r.label]) {
        seen[r.label] = true;
        result.push(r);
      }
    });
    return result;
  }

  var D = window.docx;
  var BorderStyle = D.BorderStyle, WidthType = D.WidthType, ShadingType = D.ShadingType;
  var border = {style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC'};
  var borders = {top:border,bottom:border,left:border,right:border};
  var cm = {top:80,bottom:80,left:120,right:120};

  function p(runs, opts) {
    return new D.Paragraph(Object.assign({children: Array.isArray(runs)?runs:[runs]}, opts||{}));
  }
  function tr(txt, opts) {
    return new D.TextRun(Object.assign({text:txt, font:'Arial'}, opts||{}));
  }
  function cell(children, w, fill) {
    return new D.TableCell({borders:borders, width:{size:w,type:WidthType.DXA}, margins:cm,
      shading: fill ? {fill:fill,type:ShadingType.CLEAR} : undefined,
      children: Array.isArray(children)?children:[children]});
  }

  var allBlocks = [];

  // Header
  allBlocks.push(p(tr(partenza.toUpperCase(), {bold:true,size:36,color:'1A5CB8'}), {spacing:{before:0,after:120}}));
  allBlocks.push(p(tr(today + (customList ? ('  ·  ' + dealerList.length + ' dealer') : ('  ·  Range: ±' + km + ' km  ·  ' + dealerList.length + ' dealer')), {size:20,color:'666666'}), {spacing:{before:0,after:200}}));
  allBlocks.push(p([], {spacing:{before:0,after:300}, border:{bottom:{style:BorderStyle.SINGLE,size:6,color:'1A5CB8',space:1}}}));

  dealerList.forEach(function(item, idx) {
    var d    = item.o.dealer;
    var prods = d.Active_Products_List__c || '—';
    var active = getActive(prods);
    var opps   = getOpps(prods);
    var hasMkt = prods.toLowerCase().indexOf('campaign budget') >= 0;
    var isLast = idx === dealerList.length - 1;

    allBlocks.push(p(tr((idx+1) + '. ' + (d.Name||'—'), {bold:true,size:26,color:'1A5CB8'}), {spacing:{before:280,after:60}}));
    allBlocks.push(p([
      tr((d.BillingCity||'—') + '  ·  ' + (d.Customer_Type__c||'—') + '  ·  ' + (d.Rating||'—'), {size:18,color:'666666'}),
      item.dist != null ? tr('  ·  ~' + item.dist.toFixed(1) + ' km dalla strada', {size:18,color:'999999'}) : tr('', {size:18})
    ], {spacing:{before:0,after:hasMkt?60:80}}));

    if (hasMkt) {
      allBlocks.push(p(tr('Fa marketing con MotorK (Campaign Budget attivo)', {size:18,bold:true,color:'388E3C'}), {spacing:{before:0,after:80}}));
    }

    var leftItems  = active.length ? active : ['Nessun prodotto SparK attivo'];
    var maxRows    = Math.max(leftItems.length, opps.length||1);
    var rows = [];

    rows.push(new D.TableRow({children:[
      cell(p(tr('PRODOTTI ATTIVI', {bold:true,size:18,color:'1A5CB8'})), 4400, 'D6E4F7'),
      cell(p(tr('OPPORTUNITÀ UPSELL', {bold:true,size:18,color:'E65100'})), 4600, 'FFF3E0')
    ]}));

    for (var i=0; i<maxRows; i++) {
      var lText = leftItems[i] || '';
      var rOpp  = opps[i] || null;
      rows.push(new D.TableRow({children:[
        cell(p(tr(lText, {size:18})), 4400),
        cell(rOpp
          ? p([tr(rOpp.label, {bold:true,size:18,color:'E65100'}), tr(rOpp.brief, {size:18})])
          : p(tr(opps.length===0?'Nessuna opportunità rilevata':'', {size:18,color:'999999'})), 4600)
      ]}));
    }

    allBlocks.push(new D.Table({width:{size:9000,type:WidthType.DXA}, columnWidths:[4400,4600], rows:rows}));
    if (!isLast) {
      allBlocks.push(p([], {spacing:{before:160,after:0}, border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'EEEEEE',space:1}}}));
    }
  });

  var doc = new D.Document({
    styles:{default:{document:{run:{font:'Arial',size:22}}}},
    sections:[{
      properties:{page:{size:{width:11906,height:16838},margin:{top:800,right:800,bottom:800,left:800}}},
      children:allBlocks
    }]
  });

  D.Packer.toBlob(doc).then(function(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    toast('✅ DOCX scaricato (' + dealerList.length + ' dealer)');
  }).catch(function(e){ toast('⚠ Errore DOCX: ' + e.message); });
}

function parseQuery(q) {
  var filters = { hasProd:[], notProd:[], type:null, rating:null, city:null, province:null };

  var PRODS = ['webspark ultra','webspark classic','webspark','leadspark','callspark',
               'stockspark','reportspark','fidspark','predictspark','adspark',
               'agentspark','seospark','cdp','datastudio'];

  var qLow = q.toLowerCase();
  var notKws = ['senza ','non ','privi di ','che non hanno ','ma non '];

  PRODS.forEach(function(p) {
    var idx = qLow.indexOf(p.toLowerCase());
    if (idx < 0) return;
    var before = qLow.substring(0, idx);
    var isNot = false;
    notKws.forEach(function(kw) { if (before.lastIndexOf(kw) >= 0) isNot = true; });
    if (isNot) { filters.notProd.push(p); }
    else { filters.hasProd.push(p); }
  });

  var TYPES = ['customer','prospect','new','ex','ex-cliente','multimarche','ufficiale'];
  // Sinonimi italiani
  var TYPE_SYNONYMS = {
    'clienti attivi':'customer','cliente attivo':'customer','clienti':'customer',
    'ex clienti':'ex','ex-clienti':'ex','ex cliente':'ex',
    'prospect':'prospect','nuovi':'new','nuovo':'new',
    'ufficiali':'ufficiale','multimarca':'multimarche'
  };
  Object.keys(TYPE_SYNONYMS).forEach(function(k){ if(qLow.indexOf(k)>=0) filters.type=TYPE_SYNONYMS[k]; });
  TYPES.forEach(function(t) { if (qLow.indexOf(t) >= 0 && !filters.type) filters.type = t; });

  var RATINGS = ['hot','warm','cold','important','medium'];
  RATINGS.forEach(function(r) { if (qLow.indexOf(r) >= 0) filters.rating = r; });

  // Mappa nome provincia → sigla
  var PROV_MAP = {
    'bergamo':'bg','milano':'mi','torino':'to','genova':'ge','varese':'va',
    'como':'co','lecco':'lc','sondrio':'so','brescia':'bs','monza':'mb',
    'lodi':'lo','cremona':'cr','mantova':'mn','pavia':'pv','novara':'no',
    'vercelli':'vc','biella':'bi','verbania':'vb','alessandria':'al',
    'asti':'at','cuneo':'cn','savona':'sv','imperia':'im','la spezia':'sp',
    'aosta':'ao','piacenza':'pc','parma':'pr','bologna':'bo','modena':'mo',
    'reggio emilia':'re','ferrara':'fe','ravenna':'ra','trento':'tn',
    'verona':'vr','vicenza':'vi','padova':'pd','venezia':'ve','treviso':'tv',
    'udine':'ud','trieste':'ts','pordenone':'pn','gorizia':'go'
  };

  var provDiMatch = qLow.match(/provincia\s+(?:di\s+)?([a-zà-ü\s]{3,}?)(?:\s|$)/i);
  var cityMatch = qLow.match(/(?:a|in)\s+([a-zà-ü\s]{3,}?)(?:\s*(?:con|senza|che|$))/i);
  var extracted = provDiMatch ? provDiMatch[1].trim() : (cityMatch ? cityMatch[1].trim() : null);

  if (extracted) {
    var isComune = qLow.indexOf('comune di') >= 0 || qLow.indexOf('citta di') >= 0 || qLow.indexOf('città di') >= 0;
    if (isComune) {
      // cerca solo nella città esatta
      filters.city = extracted;
    } else if (PROV_MAP[extracted]) {
      // nome di provincia noto → usa sigla su BillingState
      filters.province = PROV_MAP[extracted];
      filters.city = null;
    } else {
      // comune generico → cerca in BillingCity
      filters.city = extracted;
    }
  }

  var provMatch = q.match(/([A-Z]{2})/);
  if (provMatch) filters.province = provMatch[1].toLowerCase();

  return filters;
}

function matchDealer(d, f) {
  var prods = (d.Active_Products_List__c || '').toLowerCase();
  var type  = (d.Customer_Type__c || '').toLowerCase();
  var rating = (d.Rating || '').toLowerCase();
  var city  = (d.BillingCity || '').toLowerCase();
  var prov  = (d.BillingState || '').toLowerCase();

  function hasProduct(prodField, term) { return prodField.indexOf(term.toLowerCase()) >= 0; }

  for (var i=0; i<f.hasProd.length; i++) {
    if (!hasProduct(prods, f.hasProd[i])) return false;
  }
  for (var j=0; j<f.notProd.length; j++) {
    if (hasProduct(prods, f.notProd[j])) return false;
  }
  if (f.type) {
    var typeMap = {'customer':'customer','prospect':'prospect','new':'prospect',
      'ex':'ex','ex-cliente':'ex','multimarche':'multimarche','ufficiale':'ufficiale'};
    var mapped = typeMap[f.type] || f.type;
    if (type.indexOf(mapped) < 0) return false;
  }
  if (f.rating && rating.indexOf(f.rating) < 0) return false;
  if (f.city) {
    if (city.indexOf(f.city) < 0) return false;
  }
  if (f.province && prov.indexOf(f.province) < 0) return false;
  return true;
}

function buildMatchReason(d, f) {
  var parts = [];
  if (f.hasProd.length) parts.push('Ha: ' + f.hasProd.join(', '));
  if (f.notProd.length) parts.push('Senza: ' + f.notProd.join(', '));
  if (f.type) parts.push('Tipo: ' + (d.Customer_Type__c || f.type));
  if (f.rating) parts.push('Rating: ' + f.rating);
  if (f.city) parts.push('Città: ' + (d.BillingCity || f.city));
  return parts.join(' · ') || 'Corrisponde alla ricerca';
}

function runAiSearch() {
  var query = document.getElementById('ai-search-input').value.trim();
  if (!query) return;
  if (!markers || markers.length === 0) {
    document.getElementById('ai-search-status').textContent = '⚠ Nessun dato caricato';
    return;
  }

  document.getElementById('ai-search-status').textContent = 'Ricerca in corso…';
  document.getElementById('ai-search-results').innerHTML = '';

  var f = parseQuery(query);
  var results = [];

  markers.forEach(function(o) {
    var d = o.dealer;
    if (matchDealer(d, f)) {
      results.push({
        name: d.Name,
        city: d.BillingCity || '',
        type: d.Customer_Type__c || '',
        rating: d.Rating || '',
        products: d.Active_Products_List__c || '',
        matchReason: buildMatchReason(d, f),
        _marker: o
      });
    }
  });

  document.getElementById('ai-search-status').textContent = results.length + ' risultati';
  renderAiResults(results);
  highlightAiResults(results);
}

function renderAiResults(results) {
  var container = document.getElementById('ai-search-results');
  container.innerHTML = '';
  if (results.length === 0) {
    container.innerHTML = '<div style="padding:16px;color:#888;font-size:13px;text-align:center">Nessun dealer trovato</div>';
    return;
  }
  results.forEach(function(r) {
    var matchedMarker = null;
    markers.forEach(function(o) {
      if (!matchedMarker && o.dealer.Name === r.name) matchedMarker = o;
    });
    var col = matchedMarker ? tc(matchedMarker.dealer.Customer_Type__c) : '#888';
    var el = document.createElement('div');
    el.className = 'ai-item';
    el.innerHTML = '<div class="ai-item-name">' + r.name + '</div>'
      + '<div class="ai-item-meta"><span class="ai-item-badge" style="background:' + col + ';color:#fff">' + (r.type||'—') + '</span>'
      + (r.city ? '📍 ' + r.city : '') + ' · ' + (r.rating||'—') + '</div>'
      + '<div class="ai-item-meta" style="margin-top:3px;color:#555">' + (r.products||'—') + '</div>'
      + '<div class="ai-item-meta" style="margin-top:4px;background:#f3e5f5;border-radius:4px;padding:3px 6px;color:#6a1b9a;font-style:italic">' + (r.matchReason||'') + '</div>';
    if (matchedMarker) {
      el.onclick = (function(o){ return function(){
        map.setView(o.marker.getLatLng(), 13);
        o.marker.openPopup();
      }; })(matchedMarker);
    }
    container.appendChild(el);
  });
}

function highlightAiResults(results) {
  var matchNames = new Set(results.map(function(r){ return r.name; }));
  markerLayer.clearLayers();
  markers.forEach(function(o) {
    var d = o.dealer;
    var isMatch = matchNames.has(d.Name);
    var col = tc(d.Customer_Type__c), r = ri(d.Rating), s = r.s;
    if (isMatch) s = s + 4;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(s*2)+'" height="'+(s*2)+'" viewBox="0 0 '+(s*2)+' '+(s*2)+'">'
      +'<circle cx="'+s+'" cy="'+s+'" r="'+(s-2)+'" fill="'+col+'" stroke="'+(isMatch?'#ce93d8':'white')+'" stroke-width="'+(isMatch?3:2)+'" opacity="'+(isMatch?1:.25)+'"/>'
      +'<circle cx="'+s+'" cy="'+s+'" r="'+Math.floor(s/3)+'" fill="white" opacity="'+(isMatch?.9:.15)+'"/>'
      +'</svg>';
    var icon = L.divIcon({html:svg,className:'',iconSize:[s*2,s*2],iconAnchor:[s,s],popupAnchor:[0,-s]});
    o.marker.setIcon(icon);
    markerLayer.addLayer(o.marker);
  });
}

async function runRadar(comuneRaw, kmRange) {
  var pCoords = latLng(comuneRaw);
  if (!pCoords) {
    toast('🔄 Geolocalizzazione comune…');
    await geocodeCitiesBatch([comuneRaw]);
    pCoords = latLng(comuneRaw);
  }
  if (!pCoords) { toast('⚠ Comune non trovato: ' + comuneRaw); return; }
  runRadarFromCoords(pCoords, kmRange, comuneRaw);
}

function runRadarFromCoords(pCoords, kmRange, labelText) {
  clearRoute();
  toast('🔄 Ricerca dealer nel raggio di ' + kmRange + ' km…');

  // Cerchio visivo sulla mappa
  if (window._radarCircle) map.removeLayer(window._radarCircle);
  window._radarCircle = L.circle([pCoords.lat, pCoords.lng], {
    radius: kmRange * 1000,
    color: '#e53935', weight: 2, opacity: 0.7,
    fillColor: '#e53935', fillOpacity: 0.06
  }).addTo(map);
  map.fitBounds(window._radarCircle.getBounds().pad(0.05));

  // Trova dealer nel raggio
  var q = document.getElementById('search').value.toLowerCase().trim();
  omwDealers = [];
  markers.forEach(function(o) {
    var d = o.dealer;
    if((!d.Customer_Type__c || activeTypes.has(d.Customer_Type__c)) &&
       (!d.Rating || activeRatings.has(d.Rating)) &&
       (!q || d.Name.toLowerCase().includes(q))) {
      var ll = o.marker.getLatLng();
      var dist = haversine(pCoords.lat, pCoords.lng, ll.lat, ll.lng);
      if (dist <= kmRange) omwDealers.push({o: o, dist: dist});
    }
  });

  omwDealers.sort(function(a, b) { return a.dist - b.dist; });

  // Evidenzia marker
  markerLayer.clearLayers();
  var matchSet = new Set(omwDealers.map(function(x){ return x.o; }));
  markers.forEach(function(o) {
    var d = o.dealer;
    var isMatch = matchSet.has(o);
    var col = tc(d.Customer_Type__c), r = ri(d.Rating), s = r.s;
    if (isMatch) s = s + 4;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(s*2)+'" height="'+(s*2)+'" viewBox="0 0 '+(s*2)+' '+(s*2)+'">'
      +'<circle cx="'+s+'" cy="'+s+'" r="'+(s-2)+'" fill="'+col+'" stroke="'+(isMatch?'#ffe600':'white')+'" stroke-width="'+(isMatch?3:2)+'" opacity="'+(isMatch?1:.25)+'"/>'
      +'<circle cx="'+s+'" cy="'+s+'" r="'+Math.floor(s/3)+'" fill="white" opacity="'+(isMatch?.9:.15)+'"/>'
      +'</svg>';
    var icon = L.divIcon({html:svg,className:'',iconSize:[s*2,s*2],iconAnchor:[s,s],popupAnchor:[0,-s]});
    o.marker.setIcon(icon);
    markerLayer.addLayer(o.marker);
  });

  // Pannello
  var panel = document.getElementById('omw-result-panel');
  var list = document.getElementById('omw-panel-list');
  document.getElementById('omw-panel-title').textContent = omwDealers.length + ' dealer entro ' + kmRange + ' km da ' + labelText;
  list.innerHTML = '';
  if (omwDealers.length === 0) {
    list.innerHTML = '<div style="padding:16px;color:#888;font-size:13px;text-align:center">Nessun dealer trovato<br>nel raggio selezionato</div>';
  } else {
    omwDealers.forEach(function(item, idx) {
      var d = item.o.dealer;
      var col = tc(d.Customer_Type__c);
      var el = document.createElement('div');
      el.className = 'omw-item';
      el.innerHTML = '<div class="omw-item-name">' + (idx+1) + '. ' + d.Name + '</div>'
        + '<div class="omw-item-meta" style="color:'+col+';font-weight:600">' + (d.Customer_Type__c||'—') + '</div>'
        + '<div class="omw-item-meta">📍 ' + (d.BillingCity||'—') + ' · ' + (d.Rating||'—') + '</div>'
        + '<div class="omw-item-meta" style="color:#555">' + (d.Active_Products_List__c||'—') + '</div>'
        + '<div class="omw-item-dist">~' + item.dist.toFixed(1) + ' km dal centro</div>';
      el.onclick = (function(o){ return function(){ map.setView(o.marker.getLatLng(),13); o.marker.openPopup(); }; })(item.o);
      list.appendChild(el);
    });
  }

  panel.style.display = 'flex';
  document.getElementById('omw-clear').style.display = 'inline-block';
  if (omwDealers.length > 0) 
  toast('✅ ' + omwDealers.length + ' dealer entro ' + kmRange + ' km da ' + labelText);
  updateVisibleCount(omwDealers.length);
}


function exportUnified() {
  if (!window.docx) { toast('⚠ Libreria DOCX non caricata'); return; }
  if (!markers || markers.length === 0) { toast('⚠ Nessun dato caricato'); return; }

  // Se c'è rotta o radar attivi → usa quelli
  if (omwDealers && omwDealers.length > 0) {
    var title = document.getElementById('omw-panel-title').textContent || 'Dealer selezionati';
    exportDOCX(omwDealers, title, 'dealer_export.docx');
    return;
  }

  // Altrimenti prendi i dealer visibili sulla mappa
  var q = document.getElementById('search').value.toLowerCase().trim();
  var visibleList = [];
  markers.forEach(function(o) {
    var d = o.dealer;
    var passa = false;
    if (q) {
      passa = d.Name.toLowerCase().indexOf(q) >= 0;
    } else {
      passa = activeTypes.size > 0 && activeRatings.size > 0 && activeTypes.has(d.Customer_Type__c) && activeRatings.has(d.Rating);
    }
    if (passa) visibleList.push({o: o, dist: null});
  });

  if (visibleList.length === 0) { toast('⚠ Nessun dealer visibile'); return; }

  // Apri pannello se non aperto
  if (!mapPanelOpen) {
    mapPanelOpen = true;
    var panel = document.getElementById('omw-result-panel');
    panel.style.display = 'flex';
    document.getElementById('omw-panel-close').onclick = function() {
      panel.style.display = 'none';
      mapPanelOpen = false;
    };
    refreshMapPanel();
  }

  toast('📋 Export ' + visibleList.length + ' dealer in corso…');
  exportDOCX(visibleList, 'Dealer visibili sulla mappa', 'dealer_mappa_visibili.docx');
}

</script>
