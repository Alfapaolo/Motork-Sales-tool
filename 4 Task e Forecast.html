<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sales Command Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f4f1;--surface:#fff;--surface2:#efefeb;--surface0:#e8e7e2;
  --border:rgba(0,0,0,.09);--border-strong:rgba(0,0,0,.16);
  --text:#0b0b0b;--text-sec:#52514e;--text-muted:#949290;
  --accent:#1a56db;--accent-bg:#eff4ff;--accent-text:#1e40af;
  --success:#0e6245;--success-bg:#d1fae5;--success-text:#065f46;
  --danger:#b91c1c;--danger-bg:#fee2e2;
  --warning:#92400e;--warning-bg:#fef3c7;
  --red:#f90032;--radius:12px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#222221;--surface2:#2a2a28;--surface0:#1e1e1c;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --text:#f3f2ee;--text-sec:#b8b7b0;--text-muted:#6e6d6a;
  --accent:#4f7ef8;--accent-bg:#1a2d5a;--accent-text:#93b4fd;
  --success:#34d399;--success-bg:#064e3b;--success-text:#6ee7b7;
  --danger:#f87171;--danger-bg:#7f1d1d;
  --warning:#fbbf24;--warning-bg:#78350f;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.header{background:var(--surface);border-bottom:.5px solid var(--border);padding:0 1rem;display:flex;align-items:center;height:50px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.note{margin-left:auto;font-size:11px;color:var(--text-muted);background:var(--surface2);padding:4px 10px;border-radius:20px}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* DROP */
.drop-zone{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:2.5rem 1rem;text-align:center;cursor:pointer;background:var(--surface);transition:all .15s}
.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-bg)}
.drop-zone.loaded{border-color:var(--success);background:var(--success-bg)}
.drop-zone i{font-size:30px;color:var(--text-muted);display:block;margin-bottom:8px}
.drop-zone.loaded i{color:var(--success)}
.dt{font-size:14px;color:var(--text-sec);font-weight:500}
.ds{font-size:12px;color:var(--text-muted);margin-top:3px}
#fi{display:none}

/* PROGRESS */
.prog-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;border:.5px solid var(--border)}
.prog-row{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-label{font-size:13px;font-weight:500;color:var(--text)}
.prog-count{font-size:12px;color:var(--text-muted)}
.prog-bar{height:4px;background:var(--surface0);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.prog-stats{display:flex;gap:16px;margin-top:10px}
.ps{font-size:12px;color:var(--text-muted)}
.ps strong{font-size:14px;font-weight:500;color:var(--text);display:block}

/* UNDO */
.undo-bar{background:var(--warning-bg);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:.5px solid rgba(146,64,14,.3)}
.undo-text{font-size:13px;color:var(--warning)}
.undo-btn{padding:7px 14px;border-radius:var(--radius-sm);border:.5px solid rgba(146,64,14,.4);background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--warning);white-space:nowrap;display:flex;align-items:center;gap:5px}

/* TASK CARD */
.task-card{background:var(--surface);border-radius:var(--radius);border:.5px solid var(--border);overflow:hidden}
.tc-head{padding:16px 16px 0}
.tc-num{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.tc-name{font-size:22px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:3px;letter-spacing:-.4px}
.tc-prod{font-size:12px;color:var(--accent-text);margin-bottom:10px}
.badge{display:inline-flex;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;margin-bottom:12px}
.b-high{background:var(--danger-bg);color:var(--danger)}
.b-norm{background:var(--surface2);color:var(--text-muted)}
.b-done{background:var(--success-bg);color:var(--success-text)}
.tc-note{margin:0 16px 14px;padding:12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;color:var(--text-sec);line-height:1.55;border-left:3px solid var(--border-strong)}
.tc-note.empty{display:none}

/* ACTIONS */
.tc-actions{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.abtn{width:100%;padding:14px;border-radius:var(--radius-sm);border:.5px solid var(--border-strong);background:var(--surface2);font-size:14px;font-weight:500;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.abtn:active{opacity:.65;transform:scale(.98)}
.abtn.primary{background:var(--accent);color:#fff;border-color:transparent;font-size:15px;padding:16px}
.abtn i{font-size:17px}
.abtn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn-row .abtn{padding:12px 8px;font-size:13px}
.abtn-row .abtn i{font-size:15px}

/* SKIP */
.skip-sheet{display:none;padding:0 12px 12px;flex-direction:column;gap:8px}
.skip-sheet.open{display:flex}
.skip-label{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.skip-opts{display:flex;gap:6px;flex-wrap:wrap}
.skip-opt{padding:8px 14px;border-radius:20px;border:.5px solid var(--border-strong);background:var(--surface2);font-size:13px;cursor:pointer;color:var(--text-sec);font-weight:500}
.skip-opt:active{opacity:.7}

/* INPUT */
.tc-input{padding:0 12px 14px}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;padding:11px 12px;border-radius:var(--radius-sm);border:.5px solid var(--border-strong);background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;resize:none;min-height:44px;line-height:1.4}
textarea:focus{outline:none;border-color:var(--accent)}
.sbtn{padding:11px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0}
.sbtn:disabled{opacity:.3;cursor:default}

/* NAV */
.nav-card{background:var(--surface);border-radius:var(--radius);border:.5px solid var(--border);display:flex;align-items:center}
.nbtn{flex:1;padding:14px;border:none;background:transparent;font-size:14px;font-weight:500;cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px}
.nbtn:active{opacity:.6}
.nbtn:disabled{opacity:.2;cursor:default}
.ndiv{width:.5px;height:24px;background:var(--border-strong)}
.ninfo{font-size:12px;color:var(--text-muted);text-align:center;min-width:60px}

/* LOG */
.log-card{background:var(--surface);border-radius:var(--radius);border:.5px solid var(--border);overflow:hidden}
.log-head{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:.5px solid var(--border)}
.log-item{padding:10px 14px;border-bottom:.5px solid var(--border);display:flex;gap:8px;align-items:flex-start}
.log-item:last-child{border-bottom:none}
.li-c{font-size:13px;font-weight:600;color:var(--text);min-width:90px}
.li-a{font-size:12px;color:var(--text-muted);flex:1}
.li-t{font-size:11px;color:var(--text-muted);white-space:nowrap}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1s infinite}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><div class="logo-dot"></div> Sales Command Center</div>
  <div class="note">incolla in Claude ↗</div>
</div>

<div class="scroll">
<div class="stack">

  <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
    <i class="ti ti-file-spreadsheet"></i>
    <div class="dt" id="dt">Carica il file Excel dei task</div>
    <div class="ds">tocca o trascina il file</div>
    <input type="file" id="fi" accept=".xlsx,.xls">
  </div>

  <div class="prog-card" id="pc" style="display:none">
    <div class="prog-row">
      <span class="prog-label" id="pl">—</span>
      <span class="prog-count" id="pct">—</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="prog-stats">
      <div class="ps"><strong id="sd">0</strong>gestiti</div>
      <div class="ps"><strong id="sr">0</strong>rimasti</div>
      <div class="ps"><strong id="sh">0</strong>high</div>
    </div>
  </div>

  <div id="tv" style="display:none;flex-direction:column;gap:12px">

    <div class="undo-bar" id="ub" style="display:none">
      <span class="undo-text">Annullo <strong id="uc"></strong>?</span>
      <button class="undo-btn" onclick="undo()"><i class="ti ti-arrow-back-up"></i> Annulla</button>
    </div>

    <div class="task-card">
      <div class="tc-head">
        <div class="tc-num" id="tnum"></div>
        <div class="tc-name" id="tname">—</div>
        <div class="tc-prod" id="tprod"></div>
        <div id="tbadge"></div>
      </div>
      <div class="tc-note" id="tnote"></div>

      <div class="tc-actions">
        <button class="abtn primary" onclick="act('procedi — scrivi tu la mail')">
          <i class="ti ti-send"></i> Procedi — scrivi tu
        </button>
        <div class="abtn-row">
          <button class="abtn" onclick="act('gestisco io')"><i class="ti ti-user"></i> Gestisco io</button>
          <button class="abtn" onclick="act('skippa per oggi')"><i class="ti ti-arrow-right"></i> Skippa</button>
          <button class="abtn" onclick="toggleSkip()"><i class="ti ti-clock"></i> Sposta</button>
          <button class="abtn" onclick="act('lo chiamo io')"><i class="ti ti-phone"></i> Chiamo io</button>
        </div>
      </div>

      <div class="skip-sheet" id="ss">
        <div class="skip-label">Sposta avanti di</div>
        <div class="skip-opts">
          <button class="skip-opt" onclick="act('sposta +2 giorni')">+2 gg</button>
          <button class="skip-opt" onclick="act('sposta +3 giorni')">+3 gg</button>
          <button class="skip-opt" onclick="act('sposta +7 giorni')">+7 gg</button>
          <button class="skip-opt" onclick="act('sposta +2 settimane')">+2 sett</button>
          <button class="skip-opt" onclick="act('sposta a fine mese')">Fine mese</button>
        </div>
      </div>

      <div class="tc-input">
        <div class="input-row">
          <textarea id="ti" placeholder="Scrivi istruzioni aggiuntive..." rows="2"></textarea>
          <button class="sbtn" id="sb" onclick="sendCustom()" disabled>↗</button>
        </div>
      </div>
    </div>

    <div class="nav-card">
      <button class="nbtn" id="pb" onclick="nav(-1)" disabled><i class="ti ti-arrow-left"></i> Prec</button>
      <div class="ndiv"></div>
      <div class="ninfo" id="ni">— / —</div>
      <div class="ndiv"></div>
      <button class="nbtn" id="nb" onclick="nav(1)">Succ <i class="ti ti-arrow-right"></i></button>
    </div>

    <div class="log-card" id="lc" style="display:none">
      <div class="log-head">Log sessione</div>
      <div id="ll"></div>
    </div>

  </div>

</div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let tasks=[],cur=0,log=[],last=null;

const dz=document.getElementById('dz');
const fi=document.getElementById('fi');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
fi.addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0])});
document.getElementById('ti').addEventListener('input',function(){document.getElementById('sb').disabled=!this.value.trim()});

function load(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      tasks=[];
      rows.forEach((row,i)=>{
        if(i===0)return;
        const c=(row[3]||'').toString().trim();
        if(!c||/^\d+$/.test(c))return;
        tasks.push({c,prod:(row[4]||'').toString().trim(),note:(row[5]||'').toString().trim(),pri:(row[6]||'Normal').toString().trim(),done:false,azione:''});
      });
      if(!tasks.length){alert('Nessun task trovato. Controlla il file.');return}
      dz.classList.add('loaded');
      document.getElementById('dt').textContent='✓ '+tasks.length+' task — '+file.name;
      cur=0;last=null;
      document.getElementById('pc').style.display='block';
      const tv=document.getElementById('tv');tv.style.display='flex';tv.style.flexDirection='column';
      renderAll();
    }catch(err){alert('Errore lettura file: '+err.message)}
  };
  r.readAsArrayBuffer(file);
}

function renderAll(){renderProg();renderTask()}

function renderProg(){
  const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pl').textContent=pct+'% completato';
  document.getElementById('pct').textContent=done+'/'+tasks.length;
  document.getElementById('sd').textContent=done;
  document.getElementById('sr').textContent=tasks.length-done;
  document.getElementById('sh').textContent=tasks.filter(t=>t.pri==='High'&&!t.done).length;
}

function renderTask(){
  const t=tasks[cur];if(!t)return;
  document.getElementById('ni').textContent=(cur+1)+' / '+tasks.length;
  document.getElementById('pb').disabled=cur===0;
  document.getElementById('nb').disabled=cur===tasks.length-1;
  document.getElementById('tnum').textContent='Task '+(cur+1)+' di '+tasks.length;
  document.getElementById('tname').textContent=t.c;
  document.getElementById('tprod').textContent=t.prod||'';
  const ne=document.getElementById('tnote');
  ne.textContent=t.note||'';ne.className='tc-note'+(t.note?'':' empty');
  let b=`<span class="badge ${t.pri==='High'?'b-high':'b-norm'}">${t.pri}</span>`;
  if(t.done)b+=` <span class="badge b-done">✓ ${t.azione.substring(0,20)}</span>`;
  document.getElementById('tbadge').innerHTML=b;
  document.getElementById('ti').value='';
  document.getElementById('sb').disabled=true;
  document.getElementById('ss').classList.remove('open');
  renderUndo();
}

function renderUndo(){
  const ub=document.getElementById('ub');
  if(last){document.getElementById('uc').textContent=last.c;ub.style.display='flex'}
  else ub.style.display='none';
}

function act(azione){
  const t=tasks[cur];
  last={idx:cur,done:t.done,azione:t.azione,c:t.c};
  t.done=true;t.azione=azione;
  addLog(t.c,azione);
  const msg='TASK: '+t.c+'\nProdotto: '+(t.prod||'—')+'\nNote CRM: '+(t.note||'—')+'\nPriorità: '+t.pri+'\nIstruzione: '+azione;
  navigator.clipboard.writeText(msg).then(()=>showToast('Copiato — incolla in Claude ↗')).catch(()=>showToast('Copia il testo e incollalo in Claude'));
  renderAll();
  if(cur<tasks.length-1)setTimeout(()=>{cur++;renderTask()},400);
}

function sendCustom(){const v=document.getElementById('ti').value.trim();if(v)act(v)}

function undo(){
  if(!last)return;
  const t=tasks[last.idx];
  t.done=last.done;t.azione=last.azione;
  cur=last.idx;last=null;
  log.shift();
  renderAll();renderLog();
  showToast('Azione annullata');
}

function toggleSkip(){document.getElementById('ss').classList.toggle('open')}
function nav(d){cur=Math.max(0,Math.min(tasks.length-1,cur+d));renderTask()}

function addLog(c,a){
  log.unshift({c,a,t:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})});
  renderLog();
}

function renderLog(){
  const lc=document.getElementById('lc');
  if(!log.length){lc.style.display='none';return}
  lc.style.display='block';
  document.getElementById('ll').innerHTML=log.slice(0,6).map(l=>`
    <div class="log-item">
      <span class="li-c">${l.c}</span>
      <span class="li-a">${l.a}</span>
      <span class="li-t">${l.t}</span>
    </div>`).join('');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',2500);
}
</script>
</body>
</html>
