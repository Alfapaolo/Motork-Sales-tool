<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Command Center — MotorK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.18);
    --text: #0b0b0b;
    --text-sec: #52514e;
    --text-muted: #898781;
    --accent: #1a56db;
    --accent-bg: #eff4ff;
    --accent-text: #1e40af;
    --success: #0e6245;
    --success-bg: #d1fae5;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
    --warning: #92400e;
    --warning-bg: #fef3c7;
    --radius: 8px;
    --red: #f90032;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --surface: #242423;
      --surface2: #2e2e2c;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --text: #f5f4f0;
      --text-sec: #c3c2b7;
      --text-muted: #898781;
      --accent: #3b82f6;
      --accent-bg: #1e3a5f;
      --accent-text: #93c5fd;
      --success: #34d399;
      --success-bg: #064e3b;
      --danger: #f87171;
      --danger-bg: #7f1d1d;
      --warning: #fbbf24;
      --warning-bg: #78350f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 12px; height: 56px; position: sticky; top: 0; z-index: 10; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--text); }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .header-stat { font-size: 12px; color: var(--text-muted); }
  .header-stat strong { color: var(--text); font-weight: 500; }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; min-height: calc(100vh - 56px); }
  .sidebar { background: var(--surface); border-right: 0.5px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; max-height: calc(100vh - 56px); position: sticky; top: 56px; }
  .main { padding: 1.5rem; overflow-y: auto; }

  /* DROP ZONE */
  .drop-zone { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-bg); }
  .drop-zone.loaded { border-color: var(--success); background: var(--success-bg); }
  .drop-zone i { font-size: 28px; color: var(--text-muted); display: block; margin-bottom: 8px; }
  .drop-zone.loaded i { color: var(--success); }
  .drop-text { font-size: 13px; color: var(--text-sec); }
  .drop-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  #file-input { display: none; }

  /* PROGRESS */
  .progress-wrap { }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

  /* TASK LIST MINI */
  .task-list-mini { display: flex; flex-direction: column; gap: 3px; max-height: 300px; overflow-y: auto; }
  .task-mini { padding: 6px 10px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sec); border: 0.5px solid transparent; transition: all 0.1s; }
  .task-mini:hover { background: var(--surface2); }
  .task-mini.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .task-mini.done { opacity: 0.45; text-decoration: line-through; }
  .task-mini .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
  .task-mini.high .dot { background: var(--danger); }
  .task-mini.done .dot { background: var(--success); }

  /* LOG */
  .log-section { }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .log-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
  .log-item { font-size: 11px; padding: 5px 8px; border-radius: var(--radius); background: var(--surface2); display: flex; gap: 6px; align-items: flex-start; }
  .log-cliente { font-weight: 500; color: var(--text); min-width: 90px; }
  .log-azione { color: var(--text-muted); flex: 1; }
  .log-time { color: var(--text-muted); white-space: nowrap; }

  /* MAIN — TASK CARD */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; color: var(--text-muted); gap: 12px; }
  .empty-state i { font-size: 48px; }
  .empty-state p { font-size: 14px; }

  .task-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .task-header { margin-bottom: 1rem; }
  .task-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .badge-high { background: var(--danger-bg); color: var(--danger); }
  .badge-normal { background: var(--surface2); color: var(--text-muted); border: 0.5px solid var(--border); }
  .badge-done { background: var(--success-bg); color: var(--success); }
  .task-number { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .task-cliente { font-size: 24px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .task-contatto { font-size: 13px; color: var(--text-muted); }
  .task-prodotto { font-size: 13px; color: var(--accent-text); margin-top: 2px; }
  .task-note { font-size: 14px; color: var(--text-sec); line-height: 1.6; margin: 1rem 0; padding: 0.75rem 1rem; background: var(--surface2); border-radius: var(--radius); border-left: 3px solid var(--border-strong); }
  .task-note:empty, .task-note.empty { display: none; }

  /* ACTIONS */
  .actions-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .qbtn { padding: 8px 14px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 6px; transition: all 0.1s; }
  .qbtn:hover { background: var(--surface2); border-color: var(--border-strong); }
  .qbtn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .qbtn.primary:hover { opacity: 0.9; }
  .qbtn.danger { color: var(--danger); border-color: var(--danger); }
  .qbtn.danger:hover { background: var(--danger-bg); }
  .qbtn i { font-size: 15px; }

  .skip-options { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .skip-options.open { display: flex; }
  .skip-opt { padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border-strong); background: transparent; font-size: 12px; cursor: pointer; color: var(--text-muted); }
  .skip-opt:hover { background: var(--surface2); color: var(--text); }

  /* VOICE + TEXT INPUT */
  .input-section { border-top: 0.5px solid var(--border); padding-top: 1rem; margin-top: 0.5rem; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .voice-row { display: flex; gap: 8px; align-items: flex-start; }
  .voice-btn { padding: 8px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); cursor: pointer; color: var(--text-sec); display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
  .voice-btn:hover { background: var(--surface2); }
  .voice-btn.recording { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .voice-btn i { font-size: 16px; }
  .text-input { flex: 1; padding: 8px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface2); color: var(--text); font-size: 13px; font-family: inherit; resize: vertical; min-height: 40px; line-height: 1.5; }
  .text-input:focus { outline: none; border-color: var(--accent); }
  .send-btn { padding: 8px 16px; border-radius: var(--radius); border: none; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; align-self: flex-end; white-space: nowrap; }
  .send-btn:disabled { opacity: 0.35; cursor: default; }

  /* NAV */
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; }
  .nav-btn { padding: 8px 16px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
  .nav-btn:hover { background: var(--surface2); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-info { font-size: 13px; color: var(--text-muted); }

  /* KPI ROW */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .kpi { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .kpi-val { font-size: 20px; font-weight: 500; color: var(--text); }
  .kpi-val.accent { color: var(--accent); }
  .kpi-val.success { color: var(--success); }

  /* PULSE */
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .pulse { animation: pulse 1s infinite; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; border-right: none; border-bottom: 0.5px solid var(--border); }
    .kpi-row { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    Sales Command Center
  </div>
  <div class="header-right">
    <span class="header-stat" id="header-stat">nessun file caricato</span>
  </div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <i class="ti ti-file-spreadsheet"></i>
      <div class="drop-text" id="drop-text">trascina il file Excel dei task</div>
      <div class="drop-sub">oppure clicca per selezionarlo</div>
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </div>

    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-label">
        <span id="prog-done">0 gestiti</span>
        <span id="prog-tot">0 totali</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div id="task-list-section" style="display:none">
      <div class="section-label">task del giorno</div>
      <div class="task-list-mini" id="task-list-mini"></div>
    </div>

    <div class="log-section" id="log-section" style="display:none">
      <div class="section-label">log sessione</div>
      <div class="log-list" id="log-list"></div>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main" id="main">

    <div class="empty-state" id="empty-state">
      <i class="ti ti-inbox"></i>
      <p>carica il file Excel per iniziare</p>
    </div>

    <div id="task-view" style="display:none">

      <div class="kpi-row" id="kpi-row">
        <div class="kpi"><div class="kpi-label">task totali</div><div class="kpi-val" id="kpi-tot">0</div></div>
        <div class="kpi"><div class="kpi-label">gestiti</div><div class="kpi-val success" id="kpi-done">0</div></div>
        <div class="kpi"><div class="kpi-label">rimasti</div><div class="kpi-val accent" id="kpi-rem">0</div></div>
        <div class="kpi"><div class="kpi-label">high priority</div><div class="kpi-val" style="color:var(--danger)" id="kpi-high">0</div></div>
      </div>

      <div class="task-card" id="task-card">
        <div class="task-header">
          <div class="task-badges" id="task-badges"></div>
          <div class="task-number" id="task-number"></div>
          <div class="task-cliente" id="task-cliente">—</div>
          <div class="task-contatto" id="task-contatto"></div>
          <div class="task-prodotto" id="task-prodotto"></div>
        </div>

        <div class="task-note" id="task-note"></div>

        <div class="actions-label">azione rapida</div>
        <div class="quick-actions">
          <button class="qbtn primary" onclick="quickAction('procedi — scrivi tu la mail')"><i class="ti ti-send"></i> procedi</button>
          <button class="qbtn" onclick="quickAction('skippa per oggi')"><i class="ti ti-arrow-right"></i> skippa</button>
          <button class="qbtn" onclick="quickAction('gestisco io a mano')"><i class="ti ti-user"></i> gestisco io</button>
          <button class="qbtn" onclick="quickAction('lo chiamo io di persona')"><i class="ti ti-phone"></i> chiamo io</button>
          <button class="qbtn" onclick="toggleSkip()"><i class="ti ti-clock"></i> sposta avanti</button>
          <button class="qbtn danger" onclick="quickAction('metti in freezer fino a settembre')"><i class="ti ti-snowflake"></i> freezer</button>
        </div>

        <div class="skip-options" id="skip-options">
          <button class="skip-opt" onclick="quickAction('sposta avanti di 2 giorni')">+2 giorni</button>
          <button class="skip-opt" onclick="quickAction('sposta avanti di 3 giorni')">+3 giorni</button>
          <button class="skip-opt" onclick="quickAction('sposta avanti di 7 giorni')">+7 giorni</button>
          <button class="skip-opt" onclick="quickAction('sposta avanti di 2 settimane')">+2 settimane</button>
          <button class="skip-opt" onclick="quickAction('sposta avanti a fine mese')">fine mese</button>
        </div>

        <div class="input-section">
          <div class="input-label">oppure dimmi tu cosa fare</div>
          <div class="voice-row">
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">
              <i class="ti ti-microphone" id="voice-icon"></i>
              <span id="voice-label">parla</span>
            </button>
            <textarea class="text-input" id="text-input" placeholder="scrivi qui l'istruzione o usa il microfono..." rows="2"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendCustom()" disabled>invia ↗</button>
          </div>
        </div>

        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled><i class="ti ti-arrow-left"></i> prec</button>
          <span class="nav-info" id="nav-info"></span>
          <button class="nav-btn" id="next-btn" onclick="navigate(1)">succ <i class="ti ti-arrow-right"></i></button>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let tasks = [], current = 0, log = [];
let recognition = null, isRecording = false;

// DROP ZONE
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', ()=> dz.classList.remove('drag-over'));
dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag-over'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
fi.addEventListener('change', e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });

// TEXT INPUT
const ti = document.getElementById('text-input');
const sb = document.getElementById('send-btn');
ti.addEventListener('input', ()=> sb.disabled = ti.value.trim().length === 0);

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      tasks = [];
      rows.forEach((row, i) => {
        if(i === 0) return;
        const cliente = (row[0]||'').toString().trim();
        if(!cliente) return;
        tasks.push({
          cliente,
          contatto: (row[1]||'').toString().trim(),
          email: (row[2]||'').toString().trim(),
          prodotto: (row[3]||'').toString().trim(),
          note: (row[4]||'').toString().trim(),
          priorita: (row[5]||'Normal').toString().trim(),
          stato: (row[6]||'').toString().trim(),
          done: false,
          azione: ''
        });
      });
      if(!tasks.length) { alert('Nessun task trovato. Controlla il file.'); return; }
      dz.classList.add('loaded');
      document.getElementById('drop-text').textContent = `✓ ${tasks.length} task caricati — ${file.name}`;
      document.getElementById('header-stat').innerHTML = `<strong>${file.name}</strong> &nbsp;·&nbsp; ${tasks.length} task`;
      current = 0;
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('task-view').style.display = 'block';
      document.getElementById('progress-wrap').style.display = 'block';
      document.getElementById('task-list-section').style.display = 'block';
      renderAll();
    } catch(err) { alert('Errore: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function renderAll() {
  renderKPI();
  renderProgress();
  renderMiniList();
  renderTask();
}

function renderKPI() {
  const done = tasks.filter(t=>t.done).length;
  const high = tasks.filter(t=>t.priorita==='High'&&!t.done).length;
  document.getElementById('kpi-tot').textContent = tasks.length;
  document.getElementById('kpi-done').textContent = done;
  document.getElementById('kpi-rem').textContent = tasks.length - done;
  document.getElementById('kpi-high').textContent = high;
}

function renderProgress() {
  const done = tasks.filter(t=>t.done).length;
  const pct = Math.round(done/tasks.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('prog-done').textContent = done + ' gestiti';
  document.getElementById('prog-tot').textContent = tasks.length + ' totali';
}

function renderMiniList() {
  document.getElementById('task-list-mini').innerHTML = tasks.map((t,i) => `
    <div class="task-mini ${t.priorita==='High'?'high':''} ${t.done?'done':''} ${i===current?'active':''}" onclick="goTo(${i})">
      <div class="dot"></div>
      <span>${t.cliente}</span>
      ${t.done?`<span style="margin-left:auto;font-size:10px;color:var(--success)">✓</span>`:''}
    </div>
  `).join('');
}

function renderTask() {
  const t = tasks[current];
  if(!t) return;
  document.getElementById('nav-info').textContent = `${current+1} / ${tasks.length}`;
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === tasks.length-1;
  document.getElementById('task-number').textContent = `task ${current+1} di ${tasks.length}`;
  document.getElementById('task-cliente').textContent = t.cliente;
  document.getElementById('task-contatto').textContent = t.contatto ? `👤 ${t.contatto}` : '';
  document.getElementById('task-prodotto').textContent = t.prodotto ? `🏷 ${t.prodotto}` : '';
  const noteEl = document.getElementById('task-note');
  noteEl.textContent = t.note || '';
  noteEl.className = 'task-note' + (!t.note ? ' empty' : '');
  let badges = `<span class="badge ${t.priorita==='High'?'badge-high':'badge-normal'}">${t.priorita}</span>`;
  if(t.done) badges += `<span class="badge badge-done">✓ gestito</span>`;
  document.getElementById('task-badges').innerHTML = badges;
  document.getElementById('text-input').value = '';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('skip-options').classList.remove('open');
}

function goTo(i) { current = i; renderMiniList(); renderTask(); }
function navigate(dir) { current = Math.max(0, Math.min(tasks.length-1, current+dir)); renderMiniList(); renderTask(); }
function toggleSkip() { document.getElementById('skip-options').classList.toggle('open'); }

function quickAction(azione) {
  const t = tasks[current];
  t.done = true; t.azione = azione;
  addLog(t.cliente, azione);
  copyToClipboard(buildMessage(t, azione));
  renderAll();
  if(current < tasks.length-1) setTimeout(()=>{ current++; renderMiniList(); renderTask(); }, 400);
}

function sendCustom() {
  const testo = document.getElementById('text-input').value.trim();
  if(!testo) return;
  const t = tasks[current];
  t.done = true; t.azione = testo.substring(0,50);
  addLog(t.cliente, testo);
  copyToClipboard(buildMessage(t, testo));
  renderAll();
  if(current < tasks.length-1) setTimeout(()=>{ current++; renderMiniList(); renderTask(); }, 400);
}

function buildMessage(t, azione) {
  return `TASK: ${t.cliente}
Contatto: ${t.contatto||'—'}
Prodotto: ${t.prodotto||'—'}
Note CRM: ${t.note||'—'}
Priorità: ${t.priorita}
Istruzione: ${azione}`;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Messaggio copiato — incollalo in Claude!');
  }).catch(()=>{
    showToast('Copia manuale: Ctrl+C', text);
  });
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if(!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:24px;right:24px;background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;transition:opacity 0.3s'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  setTimeout(()=> t.style.opacity='0', 2500);
}

function addLog(cliente, azione) {
  log.unshift({cliente, azione, time: new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})});
  document.getElementById('log-section').style.display = 'block';
  document.getElementById('log-list').innerHTML = log.slice(0,10).map(l=>`
    <div class="log-item">
      <span class="log-cliente">${l.cliente}</span>
      <span class="log-azione">${l.azione}</span>
      <span class="log-time">${l.time}</span>
    </div>
  `).join('');
}

// VOICE
function toggleVoice() {
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Riconoscimento vocale disponibile solo su Chrome. Usa la casella di testo.');
    return;
  }
  if(isRecording) { recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'it-IT';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-label').innerHTML = '<span class="pulse">● rec</span>';
  };
  recognition.onresult = e => {
    let t = '';
    for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
    document.getElementById('text-input').value = t;
    document.getElementById('send-btn').disabled = t.trim().length === 0;
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('voice-btn').classList.remove('recording');
    document.getElementById('voice-label').textContent = 'parla';
  };
  recognition.onerror = e => {
    isRecording = false;
    document.getElementById('voice-btn').classList.remove('recording');
    document.getElementById('voice-label').textContent = 'parla';
  };
  recognition.start();
}
</script>
